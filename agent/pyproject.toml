[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparsemac"
version = "0.1.0"
description = "Wan sparse-search multi-agent video generation prototype"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23.5,<2",
  "opencv-python-headless>=4.9.0.80,<4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
gemini = ["google-genai>=1.0"]
generation = [
  "accelerate>=1.1.1",
  "diffusers>=0.31.0",
  "easydict",
  "ftfy",
  "imageio",
  "imageio-ffmpeg",
  "pillow",
  "tokenizers>=0.20.3",
  "torch>=2.4.0",
  "torchvision>=0.19.0",
  "tqdm",
  "transformers>=4.49.0",
]

[project.scripts]
sparsemac = "sparsemac.run:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sparsemac*"]

[tool.setuptools.package-data]
sparsemac = [
  "prompts/*.txt",
  "prompts/primary_skills/*.txt",
  "prompts/secondary_skills/*.txt",
  "prompts/semantic_v2/*.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
